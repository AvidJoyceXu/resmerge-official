defaults:
  - _self_
  - task: franka_leap_image_singlergb

encoder_inputs: franka_leap_rgb

encoder_name: vit-small

# name: ${dataset_name}_${mask_camera}_lag${lag}_${encoder_name}
name: ${task.dataset_name}_${encoder_name}
_target_: psi_policy.workspace.psi_policy_workspace.PsiPolicyWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

n_action_steps: 16
n_obs_steps: 1
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_cond: True

policy:
  _target_: psi_policy.policy.psi_policy.PsiPolicy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.DDIMScheduler
    num_train_timesteps: 50
    beta_start: 0.0001
    beta_end: 0.02
    # beta_schedule is important
    # this is the best we found
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon # or sample

  obs_encoder:
    _target_: psi_policy.model.vision.timm_obs_encoder_${encoder_inputs}.TimmObsEncoder
    shape_meta: ${shape_meta}
    model_name: "vit_small_r26_s32_224"
    use_augmentation: True
    crop_ratio: 0.95
    # language_embedding_dim: 768
    # model_name: "google/siglip2-base-patch16-224"

  num_inference_steps: 16 
  input_pertub: 0.1 # reference: https://github.com/forever208/DDPM-IP
  n_layer: 6
  n_head: 4
  p_drop_attn: 0.1
  use_attn_mask: False
  use_rotary_emb: True

ema:
  _target_: psi_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  lr: 1.0e-4
  weight_decay: 1e-4
  betas: [0.95, 0.999]

  start_ckpt_path: null
  # start_ckpt_path: '/path/to/local/resource'
  start_normalizer_path: null
  # start_normalizer_path: '/path/to/local/resource'

  is_ckpt_dit_lora: False
  is_ckpt_obs_encoder_lora: False
  obs_encoder_mode: "full_train" # choose from ["freeze", "lora", "full_train"]
  obs_encoder_lora_cfg: # only used when obs_encoder_mode is "lora"
    lora_dim: 2
    lora_scaling: 2.0
    include_module_names: ["blocks"]
    exclude_module_names: ["frozen"]
  dit_mode: "full_train" # choose from ["freeze", "lora", "full_train"]
  dit_lora_cfg: # only used when dit_mode is "lora"
    lora_dim: 2
    lora_scaling: 2.0
    include_module_names: ["blocks"]
    exclude_module_names: []

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  num_epochs: 10000
  gradient_accumulate_every: 1
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  use_ema: False
  # training loop control
  # in epochs
  rollout_every: 10
  checkpoint_every: 50
  val_every: 100
  sample_every: 20
  gen_attn_map: False
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: imle

  dir: ${oc.env:PROJECT_ROOT}/data
  resume: False
  mode: online

  entity: null
  name: ${now:%Y.%m.%d-%H.%M}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 20
    format_str: "epoch={epoch:04d}-train_loss={train_loss:.5f}.ckpt"
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: ${oc.env:PROJECT_ROOT}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${oc.env:PROJECT_ROOT}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${task_name}
  sweep:
    dir: ${oc.env:PROJECT_ROOT}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${task_name}
    subdir: ${hydra.job.num}
