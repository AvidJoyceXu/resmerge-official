[project]
name = "psipolicy-env"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.2.6", "scipy==1.15.3", "torch==2.5.1", "torchvision==0.20.1",
    "timm==1.0.12", "diffusers==0.32.2", "accelerate==1.2.0",
    "hydra-core==1.3.2", "zarr==2.18.7", "numcodecs==0.15.1",
    "h5py==3.12.1", "dill", "einops", "wandb", "opencv-python==4.11.0.86",
    "matplotlib", "tqdm", "colorama", "termcolor", "pandas==2.2.3", "rotary-embedding-torch==0.8.9"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["psi_policy*", "psi_reward*", "visualization*", "model_inference_server.model_inference*", "utils*"]
exclude = ["archive*", "data*", "assets*", "third_party*", "test*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
 
[tool.uv.pip]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.uv]
managed = true
python-preference = "managed"
